# Release-signed Play-flavor AAB for Google Play *Internal testing*. Nothing is uploaded
# to Play by this workflow: the signed bundle is kept as a workflow artifact for the
# account holder to upload in Play Console (Testing → Internal testing).
#
# Required repository secrets (never commit them):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# On push, a preflight reports missing secrets and an UNSIGNED bundle is built to check
# the release configuration (no SMS permissions in the play flavor).
name: android-internal
on:
  workflow_dispatch:
  push:
    branches: [claude/kuwait-banks-aggregation-app-egj8k8]
    paths: ['.github/workflows/android-internal.yml', 'fils/mobile/android/**', 'fils/mobile/pubspec.yaml']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'
  BUNDLETOOL_VERSION: '1.17.2'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$K" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$P" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$A" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KP" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing secrets: ${missing[*]}. No signed bundle attempted."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
          fi

  bundle:
    needs: preflight
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fils/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }  # same as mobile-ci; Android lint needs JDK 21
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write signing config (signed run only; removed afterwards)
        if: needs.preflight.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$K" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$P" "$A" "$KP" > android/key.properties
      # Device-test configuration: staging, no API URL → fully local; cloud features show
      # "not configured". Internal testers can use capture, ledger and the local planner.
      - name: Build Play-flavor App Bundle
        run: |
          BN=$((3000 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          flutter build appbundle --release --flavor play --build-number=$BN --dart-define=FILS_ENV=staging
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - name: Check the bundle (no SMS permissions; signature when signed)
        run: |
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          test -f "$AAB"
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" > "$RUNNER_TEMP/manifest.xml"
          if grep -Ei 'uses-permission[^>]*(READ_SMS|RECEIVE_SMS|SEND_SMS|RECEIVE_MMS|READ_CALL_LOG)' "$RUNNER_TEMP/manifest.xml"; then echo "::error::SMS/call-log permission in the play flavor"; exit 1; fi
          grep -o 'package="[^"]*"' "$RUNNER_TEMP/manifest.xml"
          if jarsigner -verify -certs "$AAB" > "$RUNNER_TEMP/sig.txt" 2>&1 && grep -q "jar verified" "$RUNNER_TEMP/sig.txt"; then
            SIGNED=yes; grep -m1 -E 'X.509|CN=' "$RUNNER_TEMP/sig.txt" || true
          else
            SIGNED=no
          fi
          echo "### Play-flavor AAB build $BUILD_NUMBER: signed=$SIGNED, no SMS permissions" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.preflight.outputs.ready }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$SIGNED" != "yes" ]; then
            echo "::error::Expected a signed bundle"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: needs.preflight.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: fils-play-internal-${{ env.BUILD_NUMBER }}
          path: fils/mobile/build/app/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 7
